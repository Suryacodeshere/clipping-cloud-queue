name: 24/7 Instagram Reel Cloud Uploader

on:
  schedule:
    # Runs every 3 hours (at minute 0)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions anytime

jobs:
  upload_next_reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Cloud Upload (Next 1 Clip)
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          python uploader.py --manifest queue/render_manifest.json --test-mode

      - name: Commit & Push Updated Queue
        run: |
          git config --global user.name "Cloud Uploader Bot"
          git config --global user.email "bot@clipping.cloud"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-published next Instagram Reel & cleaned up queue [skip ci]"
            git push
          fi
