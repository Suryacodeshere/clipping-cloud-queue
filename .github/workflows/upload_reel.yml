name: 24/7 Instagram Reel Cloud Uploader

on:
  schedule:
    # Backup internal cron (runs every 20 mins)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Primary trigger via external webhook (cron-job.org)
    inputs:
      force:
        description: 'Force immediate upload (ignore 2.5h spacing)'
        required: false
        type: boolean
        default: false

# Prevent overlapping runs from colliding on git commits or uploads
concurrency:
  group: instagram-upload-queue
  cancel-in-progress: false

jobs:
  upload_next_reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Cloud Upload (Next 1 Clip)
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_SETTINGS: ${{ secrets.IG_SETTINGS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          python uploader.py --manifest queue/render_manifest.json --min-interval 2.5 $EXTRA_ARGS

      - name: Commit & Push Updated Queue
        if: always()
        run: |
          git config --global user.name "Cloud Uploader Bot"
          git config --global user.email "bot@clipping.cloud"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-published next Instagram Reel & cleaned up queue [auto-queue]"
            git pull --rebase origin main
            git push origin main
          fi
