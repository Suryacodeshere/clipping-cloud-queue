name: 24/7 Instagram Reel Cloud Uploader

on:
  schedule:
    # Backup internal cron (primary 30m trigger runs via external cron-job.org dispatch)
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force immediate upload (ignore spacing & quiet hours)'
        required: false
        type: boolean
        default: false

# Prevent overlapping runs from colliding on git commits or uploads
concurrency:
  group: instagram-upload-queue
  cancel-in-progress: false

jobs:
  upload_next_reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Metadata Only (Blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /uploader.py
            /requirements.txt
            /queue/render_manifest.json
            /queue/instagram_upload_results.json
            /queue/youtube_upload_results.json

      - name: Fast Pre-Check Pacing & Plan Files
        id: plan
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_SETTINGS: ${{ secrets.IG_SETTINGS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          python3 uploader.py --plan-only --manifest queue/render_manifest.json --min-interval 2.5 --yt-interval 18.0 $EXTRA_ARGS

      - name: Fetch Needed Video Blob(s) Only
        if: steps.plan.outputs.run_needed == 'true' && steps.plan.outputs.fetch_files != ''
        run: |
          git sparse-checkout add ${{ steps.plan.outputs.fetch_files }}

      - name: Set up Python
        if: steps.plan.outputs.run_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.plan.outputs.run_needed == 'true'
        run: |
          pip install -r requirements.txt

      - name: Run Cloud Upload
        if: steps.plan.outputs.run_needed == 'true'
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_SETTINGS: ${{ secrets.IG_SETTINGS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          python uploader.py --manifest queue/render_manifest.json --min-interval 2.5 --yt-interval 18.0 $EXTRA_ARGS

      - name: Commit & Push Updated Queue
        if: ${{ !cancelled() && steps.plan.outputs.run_needed == 'true' }}
        run: |
          git config --global user.name "Cloud Uploader Bot"
          git config --global user.email "bot@clipping.cloud"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-published clip & synced queue [auto-queue]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
